name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the Windows app with a synthetic microphone
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/win-unpacked/Grooveprint.exe').Path
          $fixture = (Resolve-Path '../syncopated-phrase.wav').Path
          $report = Join-Path $env:RUNNER_TEMP 'grooveprint-test.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', ('"' + $report + '"'), '--fixture', ('"' + $fixture + '"')) -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Grooveprint test timed out'
          }
          if (-not (Test-Path $report)) { throw "Missing test report. Exit code $($process.ExitCode)" }
          $result = Get-Content $report -Raw
          Write-Output $result
          if ($process.ExitCode -ne 0 -or -not ($result | ConvertFrom-Json).ok) {
            throw 'Grooveprint smoke test failed'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Grooveprint-Windows-x64
          path: desktop/dist/Grooveprint-Windows-x64-Setup.exe
          if-no-files-found: error
